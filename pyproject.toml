
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexhr-features"
version = "1.0.0"
description = "Reusable feature engineering and preprocessing for CortexHR"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cortexhr_features*", "features*"]
